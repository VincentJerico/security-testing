services:
  juice-shop:
    image: bkimminich/juice-shop:v18.0.0
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          '/nodejs/bin/node',
          '-e',
          "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  # Started on demand by `npm run scan:baseline`. Scans juice-shop over the private compose network.
  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0
    profiles: ['scan']
    depends_on:
      juice-shop:
        condition: service_healthy
    volumes:
      - ./zap:/zap/wrk:rw
