name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Lint · format · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run audit:deps

  security-tests:
    name: Security tests and ZAP baseline (local Juice Shop)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The session-cookie test logs in through a real browser.
      - run: npx playwright install --with-deps chromium
      - run: npm run app:start
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      # ZAP's container runs as its own user and writes its reports into ./zap.
      - run: chmod a+w zap
      - run: npm run scan:baseline
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: zap-baseline-report
          path: |
            zap/report.html
            zap/report.json
          retention-days: 14
      - run: npm run app:stop
        if: ${{ always() }}

  dependency-scan:
    name: Dependency scan (Trivy)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Fails if the scanner misses the known CVE in the fixture; the Juice Shop scan only reports.
      - run: npm run scan:deps
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dependency-scan-reports
          path: reports/
          retention-days: 14

  # Uses the gate the way another repo would: app started in this job, then the composite action.
  gate-selftest:
    name: Security gate self-test (Juice Shop)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up -d --wait
      - name: Gate passes with the Juice Shop policy (S-1 to S-5 accepted) and ZAP rules
        uses: ./gate
        with:
          policy: gate/examples/juice-shop.policy.json
          zap-rules: zap/rules.conf
      - name: Gate run that accepts nothing (expected to fail)
        id: must-fail
        continue-on-error: true
        uses: ./gate
        with:
          policy: tests/fixtures/gate-accepts-nothing.policy.json
          report-dir: security-gate-report/must-fail
      - name: Check the gate failed
        env:
          OUTCOME: ${{ steps.must-fail.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error::The gate passed with a policy that accepts nothing, so it can't fail."
            exit 1
          fi
          echo "The gate failed as expected: $(jq -r '.unexpected | length' security-gate-report/must-fail/gate.json) unaccepted findings."
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: security-gate-report
          path: security-gate-report/
          retention-days: 14
      - run: docker compose down
        if: ${{ always() }}
