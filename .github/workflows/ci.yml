name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: Lint · format · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run audit:deps

  security-tests:
    name: Security tests and ZAP baseline (local Juice Shop)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The session-cookie test logs in through a real browser.
      - run: npx playwright install --with-deps chromium
      - run: npm run app:start
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      # ZAP's container runs as its own user and writes its reports into ./zap.
      - run: chmod a+w zap
      - run: npm run scan:baseline
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: zap-baseline-report
          path: |
            zap/report.html
            zap/report.json
          retention-days: 14
      - run: npm run app:stop
        if: ${{ always() }}

  dependency-scan:
    name: Dependency scan (Trivy)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Fails if the scanner misses the known CVE in the fixture; the Juice Shop scan only reports.
      - run: npm run scan:deps
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: dependency-scan-reports
          path: reports/
          retention-days: 14
