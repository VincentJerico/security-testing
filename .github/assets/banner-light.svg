      <text x="152" y="326" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#111418"><tspan font-weight="600" fill="#555D66">S-6</tspan>  login token cookie set without HttpOnly</text>
