    .row { animation: in 0.4s ease-out backwards; }
    .caret { animation: blink 1.1s steps(1) 2s infinite; }
    @keyframes in { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .row { animation: none; } .caret { animation: none; } }
  </style>
  <rect width="1200" height="450" rx="12" fill="#FAFAF7"/>
