<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="t">
  <title id="t">Security Testing. Defensive checks against OWASP Juice Shop, running locally in Docker. FOUND: 8 findings mapped to the OWASP Top 10. FOUND: S-6  login token cookie set without HttpOnly. PASS: Every check has a self-test that proves it can fail.</title>
  <style>
