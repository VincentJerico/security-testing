  <text x="56" y="60" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="500" fill="#555D66" letter-spacing="0.6">[06] of 07 · security-testing</text>
  <rect x="786" y="52" width="46" height="6" rx="2" fill="#E3E3DE"/><rect x="838" y="52" width="46" height="6" rx="2" fill="#E3E3DE"/><rect x="890" y="52" width="46" height="6" rx="2" fill="#E3E3DE"/><rect x="942" y="52" width="46" height="6" rx="2" fill="#E3E3DE"/><rect x="994" y="52" width="46" height="6" rx="2" fill="#E3E3DE"/><rect x="1046" y="52" width="46" height="6" rx="2" fill="#0B5FD8"/><rect x="1098" y="52" width="46" height="6" rx="2" fill="#E3E3DE"/>
  <text x="56" y="138" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-size="60" fill="#111418">Security Testing</text>
  <text x="58" y="178" font-family="'IBM Plex Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" fill="#555D66">Defensive checks against OWASP Juice Shop, running locally in Docker</text>
  <rect x="32" y="214" width="1136" height="208" rx="8" fill="#FFFFFF" stroke="#E3E3DE"/>
  <text x="56" y="254" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#0B5FD8">$ npm test &amp;&amp; npm run scan:baseline</text>
