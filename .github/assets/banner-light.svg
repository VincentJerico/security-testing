      <text x="94" y="290" text-anchor="middle" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#CF222E" letter-spacing="0.6">FOUND</text>
      <text x="152" y="290" font-family="'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#111418">8 findings mapped to the OWASP Top 10</text>
    </g>
    <g class="row" style="animation-delay:0.85s">
      <rect x="56" y="305" width="76" height="28" rx="4" fill="none" stroke="#CF222E" stroke-width="1.5"/>
